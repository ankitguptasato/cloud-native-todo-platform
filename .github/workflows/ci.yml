
name: CI - Todo Platform

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  validate-and-build:
    name: Validate and build application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt

      - name: Check backend Python syntax
        run: python -m compileall -q backend/app

      - name: Build backend Docker image
        run: docker build -t todo-backend:ci ./backend

      - name: Build frontend Docker image
        run: docker build -t todo-frontend:ci ./frontend

      - name: Configure AWS credentials
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-northeast-1
      
      

      - name: Log in to Amazon ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag and push backend image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: ankit-todo-backend
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker tag todo-backend:ci $REGISTRY/$REPOSITORY:$IMAGE_TAG
          docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG

      - name: Tag and push frontend image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: ankit-todo-frontend
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker tag todo-frontend:ci $REGISTRY/$REPOSITORY:$IMAGE_TAG
          docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG
      
      - name: Deploy to EC2 through AWS SSM
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail

          echo "Triggering EC2 deployment..."

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-03666c1f6c56d3d27" \
            --document-name "AWS-RunShellScript" \
            --parameters "{\"commands\":[\"sudo /opt/todo-app/deploy.sh ${GITHUB_SHA}\"]}" \
            --region ap-northeast-1 \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: ${COMMAND_ID}"

          for attempt in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "${COMMAND_ID}" \
              --instance-id "i-03666c1f6c56d3d27" \
              --region ap-northeast-1 \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")

            echo "Deployment status: ${STATUS}"

            case "${STATUS}" in
              Success)
                aws ssm get-command-invocation \
                  --command-id "${COMMAND_ID}" \
                  --instance-id "i-03666c1f6c56d3d27" \
                  --region ap-northeast-1 \
                  --query "StandardOutputContent" \
                  --output text
                echo "EC2 deployment successful."
                exit 0
                ;;
              Failed|TimedOut|Cancelled|Cancelling)
                aws ssm get-command-invocation \
                  --command-id "${COMMAND_ID}" \
                  --instance-id "i-03666c1f6c56d3d27" \
                  --region ap-northeast-1 \
                  --output json
                echo "EC2 deployment failed."
                exit 1
                ;;
            esac

            sleep 5
          done

          echo "Deployment timed out."
          exit 1


