apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: 113460354909.dkr.ecr.ap-northeast-1.amazonaws.com/ankit-todo-backend:0dd68dc562a22c781018f7262d2a09cfb8a2c797
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              value: "postgresql://todos:todos@postgres:5432/todos"
---
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  type: ClusterIP
  selector:
    app: backend
  ports:
    - port: 8000
      targetPort: 8000
      protocol: TCP