apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: 113460354909.dkr.ecr.ap-northeast-1.amazonaws.com/ankit-todo-backend:0abb056b395cc46fc18e9489a829d23eabcadd92
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              value: "postgresql://todos:todos@postgres:5432/todos"
          startupProbe:
            httpGet:
              path: /api/health/live
              port: 8000
            periodSeconds: 5
            failureThreshold: 30

          livenessProbe:
            httpGet:
              path: /api/health/live
              port: 8000
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: 8000
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  type: ClusterIP
  selector:
    app: backend
  ports:
    - port: 8000
      targetPort: 8000
      protocol: TCP