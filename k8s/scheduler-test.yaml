
apiVersion: v1
kind: Pod
metadata:
  name: scheduler-test
spec:
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: topology.kubernetes.io/zone
                operator: In
                values:
                  - ap-northeast-1z
  containers:
    - name: nginx
      image: nginx:latest
      resources:
        requests:
          cpu: "50m"
          memory: "32Mi"
